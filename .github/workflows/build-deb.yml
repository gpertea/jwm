name: Build Ubuntu 24.04 .deb

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this build?"
        required: false
        default: "manual build"

  push:
    branches: [ devel ]
    paths:
      - 'debian/**'
      - 'Makefile'
      - 'configure*'
      - 'autogen.sh'
      - 'm4/**'
      - 'src/**'
      - '.github/workflows/build-deb.yml'
    tags:
      - 'v*'

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            devscripts \
            debhelper \
            dh-make \
            fakeroot \
            lintian \
            autoconf automake libtool pkg-config \
            libx11-dev libxft-dev libxinerama-dev libxpm-dev \
            libjpeg-dev libpng-dev libxml2-dev xsltproc

      - name: Build source tree
        run: |
          if [ -f autogen.sh ]; then ./autogen.sh; fi
          if [ -f configure ]; then ./configure; fi
          make -j"$(nproc)"

      - name: Build .deb package
        run: |
          debuild -us -uc -b

      - name: Collect outputs
        run: |
          mkdir -p artifacts
          cp -v ../*.deb artifacts/ || true
          cp -v ../*.changes artifacts/ || true
          cp -v ../*.buildinfo artifacts/ || true

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jwm-deb-ubuntu24-${{ github.run_number }}
          path: artifacts/

      - name: Publish release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.deb
            artifacts/*.changes
            artifacts/*.buildinfo
          generate_release_notes: true
